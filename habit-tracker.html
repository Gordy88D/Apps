<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a; --surface: #1a1a1a; --border: #3a3a3a;
    --text: #f0f0f0; --muted: #aaa; --accent: #c8f55a;
    --danger: #ff4444; --skip: #1a1a1a;
  }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: 0.04em; color: var(--accent); line-height: 1; }
  .month-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
  .section-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 12px; }

  /* TABS */
  .tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab { font-size: 0.72rem; padding: 10px 20px; cursor: pointer; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; border-bottom: 2px solid transparent; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none; font-family: 'DM Mono', monospace; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text); }
  .view { display: none; }
  .view.active { display: block; }

  /* ADD FORM */
  .add-form { background: var(--surface); border: 1px solid var(--border); padding: 16px; margin-bottom: 20px; }
  .add-form input[type="text"] { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.8rem; padding: 10px 14px; outline: none; transition: border-color 0.2s; margin-bottom: 12px; }
  .add-form input[type="text"]:focus { border-color: var(--accent); }
  .add-form input::placeholder { color: var(--muted); }
  .day-picker { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .day-toggle { width: 32px; height: 32px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.65rem; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .day-toggle.active { background: var(--accent); border-color: var(--accent); color: #0a0a0a; font-weight: 500; }
  .every-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.65rem; padding: 6px 10px; cursor: pointer; transition: all 0.15s; }
  .every-btn:hover { border-color: var(--accent); color: var(--accent); }
  .add-btn { background: var(--accent); border: none; color: #0a0a0a; font-family: 'DM Mono', monospace; font-size: 0.8rem; font-weight: 500; padding: 10px 18px; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; margin-left: auto; display: block; margin-top: 4px; }
  .add-btn:hover { opacity: 0.85; }

  /* HABIT ROWS */
  .habit-row { margin-bottom: 8px; background: var(--surface); border: 1px solid var(--border); transition: border-color 0.2s; }
  .habit-row:hover { border-color: #333; }
  .habit-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; gap: 8px; }
  .habit-name { font-size: 0.78rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .habit-schedule { font-size: 0.6rem; color: var(--muted); white-space: nowrap; }
  .streak { font-size: 0.7rem; color: var(--accent); white-space: nowrap; min-width: 36px; text-align: right; }
  .streak.zero { color: var(--muted); }
  .delete-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; padding: 0 4px; transition: color 0.15s; line-height: 1; flex-shrink: 0; }
  .delete-btn:hover { color: var(--danger); }
  .day-dots { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 12px 10px; }
  .day-dot { width: 22px; height: 22px; border: 1px solid var(--border); background: transparent; cursor: pointer; position: relative; transition: all 0.12s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .day-dot:hover:not(.skip):not(.future) { border-color: var(--accent); }
  .day-dot.done { background: var(--accent); border-color: var(--accent); }
  .day-dot.today { border-color: var(--accent); border-width: 2px; }
  .day-dot.future { opacity: 0.25; cursor: default; }
  .day-dot.skip { background: var(--skip); border-color: #1a1a1a; cursor: default; opacity: 0.4; }
  .day-num { font-size: 0.6rem; color: #fff; pointer-events: none; }
  .day-dot.done .day-num { color: #0a0a0a; }
  .day-dot.skip .day-num { color: #333; }

  .empty-state { padding: 32px; text-align: center; color: var(--muted); font-size: 0.75rem; border: 1px dashed var(--border); letter-spacing: 0.05em; }

  /* CONFIRM OVERLAY */
  .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .confirm-box { background: var(--surface); border: 1px solid var(--accent); padding: 24px; max-width: 320px; width: 100%; }
  .confirm-msg { font-size: 0.82rem; color: var(--text); margin-bottom: 20px; line-height: 1.5; }
  .confirm-msg span { color: var(--accent); }
  .confirm-btns { display: flex; gap: 8px; }
  .confirm-yes { flex: 1; background: var(--danger); border: none; color: #fff; font-family: 'DM Mono', monospace; font-size: 0.78rem; padding: 10px; cursor: pointer; }
  .confirm-no { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.78rem; padding: 10px; cursor: pointer; }
  .confirm-no:hover { border-color: var(--text); color: var(--text); }

  /* STATS BAR */
  .stats-bar { display: flex; gap: 24px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--accent); line-height: 1; }
  .stat-label { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }

  /* HISTORY */
  .history-empty { padding: 32px; text-align: center; color: var(--muted); font-size: 0.75rem; border: 1px dashed var(--border); }
  .history-month { margin-bottom: 24px; }
  .history-month-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--text); letter-spacing: 0.05em; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; display: flex; align-items: baseline; justify-content: space-between; }
  .history-month-pct { font-size: 0.75rem; color: var(--accent); font-family: 'DM Mono', monospace; }
  .history-habit { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 4px; }
  .history-habit-name { font-size: 0.75rem; color: var(--text); flex: 1; }
  .history-bar-wrap { width: 120px; height: 6px; background: var(--border); margin: 0 12px; flex-shrink: 0; }
  .history-bar { height: 100%; background: var(--accent); transition: width 0.4s; }
  .history-pct { font-size: 0.7rem; color: var(--accent); min-width: 36px; text-align: right; }
  .history-pct.low { color: var(--danger); }
  .history-pct.mid { color: #f5c842; }

  @media (max-width: 500px) {
    .day-dot { width: 18px; height: 18px; }
    .day-num { font-size: 0.45rem; }
    .history-bar-wrap { width: 60px; }
  }
</style>
</head>
<body>

<header>
  <h1>Habits</h1>
  <span class="month-label" id="monthLabel"></span>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('current')">This Month</button>
  <button class="tab" onclick="switchTab('history')">History</button>
</div>

<!-- CURRENT MONTH -->
<div class="view active" id="view-current">
  <div class="section-label">Track Daily</div>
  <div id="habitList"></div>
  <div class="add-form">
    <input type="text" id="habitInput" placeholder="habit name..." maxlength="30" />
    <div style="font-size:0.62rem;color:var(--muted);margin-bottom:8px;letter-spacing:0.08em;">SCHEDULED DAYS (leave all off = every day)</div>
    <div class="day-picker" id="dayPicker">
      <button class="every-btn" onclick="toggleAll()">Every day</button>
      <button class="day-toggle" data-day="1">Mo</button>
      <button class="day-toggle" data-day="2">Tu</button>
      <button class="day-toggle" data-day="3">We</button>
      <button class="day-toggle" data-day="4">Th</button>
      <button class="day-toggle" data-day="5">Fr</button>
      <button class="day-toggle" data-day="6">Sa</button>
      <button class="day-toggle" data-day="0">Su</button>
    </div>
    <button class="add-btn" onclick="addHabit()">+ Add Habit</button>
  </div>
  <div class="stats-bar">
    <div class="stat"><span class="stat-val" id="statTotal">0</span><span class="stat-label">Habits</span></div>
    <div class="stat"><span class="stat-val" id="statToday">0</span><span class="stat-label">Done Today</span></div>
    <div class="stat"><span class="stat-val" id="statStreak">0</span><span class="stat-label">Best Streak</span></div>
    <div class="stat"><span class="stat-val" id="statPct">0%</span><span class="stat-label">This Month</span></div>
  </div>
</div>

<!-- HISTORY -->
<div class="view" id="view-history">
  <div class="section-label">Previous Months</div>
  <div id="historyList"></div>
</div>

<script>
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const today = now.getDate();
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAY_NAMES = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  document.getElementById('monthLabel').textContent = `${MONTHS[month]} ${year}`;

  function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function getDow(y, m, d) { return new Date(y, m, d).getDay(); }
  function storageKey(y, m) { return `habits_v2_${y}_${m}`; }

  function loadMonth(y, m) {
    try { return JSON.parse(localStorage.getItem(storageKey(y, m))) || { habits: [] }; }
    catch { return { habits: [] }; }
  }
  function saveMonth(y, m, data) {
    try { localStorage.setItem(storageKey(y, m), JSON.stringify(data)); } catch {}
  }

  let data = loadMonth(year, month);


  function isScheduled(habit, y, m, d) {
    if (!habit.days || habit.days.length === 0) return true;
    return habit.days.includes(getDow(y, m, d));
  }

  function getStreak(habit) {
    let streak = 0;
    for (let d = today; d >= 1; d--) {
      if (!isScheduled(habit, year, month, d)) continue;
      if (habit.done[d]) streak++;
      else break;
    }
    return streak;
  }

  function getBestStreak(habit) {
    let best = 0, current = 0;
    const dim = getDaysInMonth(year, month);
    for (let d = 1; d <= dim; d++) {
      if (!isScheduled(habit, year, month, d)) continue;
      if (habit.done[d]) { current++; best = Math.max(best, current); }
      else current = 0;
    }
    return best;
  }

  function getMonthPct(habit, y, m, upToDay) {
    const dim = getDaysInMonth(y, m);
    const limit = upToDay || dim;
    let possible = 0, done = 0;
    for (let d = 1; d <= limit; d++) {
      if (!isScheduled(habit, y, m, d)) continue;
      possible++;
      if (habit.done[d]) done++;
    }
    return possible > 0 ? Math.round((done / possible) * 100) : null;
  }

  function scheduleLabel(days) {
    if (!days || days.length === 0) return 'every day';
    const order = [1,2,3,4,5,6,0];
    return order.filter(d => days.includes(d)).map(d => DAY_NAMES[d]).join(' · ');
  }

  // TAB SWITCHING
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
    document.getElementById(`view-${tab}`).classList.add('active');
    if (tab === 'history') renderHistory();
  }

  // RENDER CURRENT MONTH
  function render() {
    const list = document.getElementById('habitList');
    list.innerHTML = '';
    const dim = getDaysInMonth(year, month);

    if (data.habits.length === 0) {
      list.innerHTML = '<div class="empty-state">no habits yet — add one below</div>';
      updateStats(); return;
    }

    data.habits.forEach(habit => {
      const row = document.createElement('div');
      row.className = 'habit-row';
      const header = document.createElement('div');
      header.className = 'habit-header';
      const nameEl = document.createElement('div');
      nameEl.className = 'habit-name';
      nameEl.textContent = habit.name;
      const schedEl = document.createElement('div');
      schedEl.className = 'habit-schedule';
      schedEl.textContent = scheduleLabel(habit.days);
      const streak = getStreak(habit);
      const streakEl = document.createElement('div');
      streakEl.className = streak > 0 ? 'streak' : 'streak zero';
      streakEl.textContent = streak > 0 ? `${streak}🔥` : '—';
      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.textContent = '×';
      del.addEventListener('click', () => {
        showConfirm(habit.name, () => {
          data.habits = data.habits.filter(h => h.id !== habit.id);
          saveMonth(year, month, data); render();
        });
      });
      header.appendChild(nameEl);
      header.appendChild(schedEl);
      header.appendChild(streakEl);
      header.appendChild(del);

      const dotsEl = document.createElement('div');
      dotsEl.className = 'day-dots';
      for (let d = 1; d <= dim; d++) {
        const scheduled = isScheduled(habit, year, month, d);
        const dot = document.createElement('div');
        dot.className = 'day-dot';
        if (!scheduled) dot.classList.add('skip');
        else if (habit.done[d]) dot.classList.add('done');
        if (d === today) dot.classList.add('today');
        if (d > today) dot.classList.add('future');
        const num = document.createElement('div');
        num.className = 'day-num';
        num.textContent = d;
        dot.appendChild(num);
        if (scheduled && d <= today) {
          dot.addEventListener('click', () => {
            habit.done[d] = !habit.done[d];
            saveMonth(year, month, data); render();
          });
        }
        dotsEl.appendChild(dot);
      }
      row.appendChild(header);
      row.appendChild(dotsEl);
      list.appendChild(row);
    });
    updateStats();
  }

  function updateStats() {
    const total = data.habits.length;
    const doneToday = data.habits.filter(h => isScheduled(h, year, month, today) && h.done[today]).length;
    const bestStreak = data.habits.reduce((max, h) => Math.max(max, getBestStreak(h)), 0);
    const avgPct = total > 0 ? Math.round(data.habits.reduce((sum, h) => sum + (getMonthPct(h, year, month, today) || 0), 0) / total) : 0;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statToday').textContent = doneToday;
    document.getElementById('statStreak').textContent = bestStreak;
    document.getElementById('statPct').textContent = `${avgPct}%`;
  }

  // RENDER HISTORY
  function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    const months = [];

    // Scan last 24 months for data
    for (let i = 1; i <= 24; i++) {
      let m = month - i;
      let y = year;
      while (m < 0) { m += 12; y--; }
      const d = loadMonth(y, m);
      if (d.habits && d.habits.length > 0) months.push({ y, m, data: d });
    }

    if (months.length === 0) {
      list.innerHTML = '<div class="history-empty">no previous months yet — come back next month</div>';
      return;
    }

    months.forEach(({ y, m, data: mdata }) => {
      const dim = getDaysInMonth(y, m);
      const section = document.createElement('div');
      section.className = 'history-month';

      const allPcts = mdata.habits.map(h => getMonthPctFull(h, y, m, dim)).filter(p => p !== null);
      const avgPct = allPcts.length > 0 ? Math.round(allPcts.reduce((a,b) => a+b, 0) / allPcts.length) : 0;

      const title = document.createElement('div');
      title.className = 'history-month-title';
      title.innerHTML = `<span>${MONTHS[m]} ${y}</span><span class="history-month-pct">${avgPct}% overall</span>`;
      section.appendChild(title);

      mdata.habits.forEach(habit => {
        const pct = getMonthPctFull(habit, y, m, dim);
        if (pct === null) return;
        const row = document.createElement('div');
        row.className = 'history-habit';
        const nameEl = document.createElement('div');
        nameEl.className = 'history-habit-name';
        nameEl.textContent = habit.name;
        const barWrap = document.createElement('div');
        barWrap.className = 'history-bar-wrap';
        const bar = document.createElement('div');
        bar.className = 'history-bar';
        bar.style.width = `${pct}%`;
        barWrap.appendChild(bar);
        const pctEl = document.createElement('div');
        pctEl.className = pct >= 80 ? 'history-pct' : pct >= 50 ? 'history-pct mid' : 'history-pct low';
        pctEl.textContent = `${pct}%`;
        row.appendChild(nameEl);
        row.appendChild(barWrap);
        row.appendChild(pctEl);
        section.appendChild(row);
      });
      list.appendChild(section);
    });
  }

  function getMonthPctFull(habit, y, m, dim) {
    let possible = 0, done = 0;
    for (let d = 1; d <= dim; d++) {
      if (!isScheduled(habit, y, m, d)) continue;
      possible++;
      if (habit.done[d]) done++;
    }
    return possible > 0 ? Math.round((done / possible) * 100) : null;
  }

  // DAY TOGGLES
  function toggleAll() {
    document.querySelectorAll('.day-toggle').forEach(b => b.classList.remove('active'));
  }
  document.querySelectorAll('.day-toggle').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('active'));
  });

  function getSelectedDays() {
    return [...document.querySelectorAll('.day-toggle.active')].map(b => parseInt(b.dataset.day));
  }

  function addHabit() {
    const input = document.getElementById('habitInput');
    const name = input.value.trim();
    if (!name) return;
    data.habits.push({ id: Date.now(), name, days: getSelectedDays(), done: {} });
    saveMonth(year, month, data);
    input.value = '';
    document.querySelectorAll('.day-toggle').forEach(b => b.classList.remove('active'));
    render();
  }

  document.getElementById('habitInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addHabit();
  });

  function showConfirm(name, onYes) {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <div class="confirm-msg">Remove <span>"${name}"</span>?<br>This month's data will be lost.</div>
        <div class="confirm-btns">
          <button class="confirm-yes">Remove</button>
          <button class="confirm-no">Cancel</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('.confirm-yes').addEventListener('click', () => { overlay.remove(); onYes(); });
    overlay.querySelector('.confirm-no').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  }

  render();
</script>
</body>
</html>
